<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <!-- Dark High-Tech Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>

    <!-- Google Antigravity Cosmic Pulsar Gradient -->
    <linearGradient id="antigravityGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)" stroke="#27272A" stroke-width="1.5"/>

  <!-- Antigravity Gravitational Flux Star (4-Point Star Curve) -->
  <g transform="translate(24, 24) scale(1.15) translate(-12, -12)" filter="url(#glow)">
    <path
      d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81"
      fill="url(#antigravityGrad)"
    />
    <!-- Singularity Center Core -->
    <circle cx="12" cy="12" r="3.2" fill="#FFFFFF"/>
    <circle cx="12" cy="12" r="2.2" fill="#38BDF8"/>
  </g>
</svg>
