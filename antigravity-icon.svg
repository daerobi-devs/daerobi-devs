<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Antigravity Arc Spectrum Gradient (Deep Blue -> Cyan -> Green -> Yellow -> Orange -> Coral Red) -->
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="78%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Drop shadow subtle -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Antigravity Mountain / Curve Peak Glyph -->
  <!-- Top apex curve, flowing flared legs, concave bottom curve -->
  <path
    d="M 18,78 
       C 24,70 30,55 38,36
       C 44,22 47,14 50,14
       C 53,14 56,22 62,36
       C 70,55 76,70 82,78
       C 84,81 81,84 77,81
       C 71,76 65,62 58,52
       C 53,45 47,45 42,52
       C 35,62 29,76 23,81
       C 19,84 16,81 18,78 Z"
    fill="url(#arcGrad)"
    filter="url(#softGlow)"
  />
</svg>
